name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version

          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1 || true)"
          if [[ "$JAVA_VER_LINE" =~ \"([0-9]+)[^\"]*\" ]]; then
            MAJOR_VER="${BASH_REMATCH[1]}"
            if [ "$MAJOR_VER" -eq 1 ] && [[ "$JAVA_VER_LINE" =~ \"1\.([0-9]+) ]]; then
              MAJOR_VER="${BASH_REMATCH[1]}"
            fi
          else
            echo "::error::Unable to detect the active Java version from: $JAVA_VER_LINE"
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "./debug.keystore" ]; then
            if [ -z "${JAVA_HOME:-}" ] || [ ! -x "${JAVA_HOME}/bin/keytool" ]; then
              echo "::error::keytool was not found in the configured JAVA_HOME (${JAVA_HOME:-unset})."
              exit 1
            fi

            if ! "${JAVA_HOME}/bin/keytool" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1; then
              echo "::error::Failed to create temporary debug keystore at ./debug.keystore."
              exit 1
            fi
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Temporary debug keystore ./debug.keystore does not exist."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK does not exist at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK paths inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is empty."
            exit 1
          fi

          if [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::$APK_PATH does not have the .apk extension."
            exit 1
          fi

          echo "Verified debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/release-asset-XXXXXX")"
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"

          cp -- "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset is invalid: $ASSET_PATH"
            exit 1
          fi

          {
            echo "asset_path=$ASSET_PATH"
            echo "asset_filename=$ASSET_FILENAME"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::warning::Prepared release asset validation failed: ${ASSET_PATH:-unset}"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")"
          cat > "$NOTES_FILE" <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Purpose:** Intended for testing only
          - **Release Type:** Not a Play Store production release
          - **Signing:** Signed only with a temporary debug keystore
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${GITHUB_SHA}" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: ${{ always() && steps.upload_artifact.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_FILENAME: ${{ steps.prepare_release_asset.outputs.asset_filename }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "${RELEASE_OUTCOME:-}" = "success" ]; then
            if RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>/dev/null)" && [ -n "$RELEASE_URL" ]; then
              echo "Release Tag: $RELEASE_TAG"
              echo "Release Title: $RELEASE_TITLE"
              echo "Release URL: $RELEASE_URL"
              echo "APK Asset Filename: ${ASSET_FILENAME:-}"

              {
                echo "### Debug APK Build & GitHub Release Succeeded"
                echo ""
                echo "- **Release Tag:** \`$RELEASE_TAG\`"
                echo "- **Release Title:** $RELEASE_TITLE"
                echo "- **Release Page URL:** $RELEASE_URL"
                echo "- **APK Asset Filename:** \`${ASSET_FILENAME:-}\`"
                echo ""
                echo "You can download the APK directly from the **Assets** section on the GitHub Release page above."
                echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Release creation reported success, but gh release view could not confirm tag $RELEASE_TAG. The APK build succeeded, and the Actions artifact named app-debug-apk remains available."
              {
                echo "### Warning: GitHub Release Verification Failed"
                echo ""
                echo "The debug APK build succeeded, and the GitHub Actions artifact named \`app-debug-apk\` remains available."
                echo "However, \`gh release view\` could not confirm the GitHub Release for tag \`$RELEASE_TAG\`."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Publishing the APK to GitHub Releases failed. The debug APK build succeeded, and the Actions artifact named app-debug-apk remains available."
            {
              echo "### Warning: GitHub Release Publishing Failed"
              echo ""
              echo "The debug APK build succeeded, and the GitHub Actions artifact named \`app-debug-apk\` remains available."
              echo "Please inspect the \`Publish APK to GitHub Releases\` step logs for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
